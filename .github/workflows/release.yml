name: Build and Release Planet Snake 3D

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/keystores" "$HOME/.config/godot"
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl_extract
          mv /tmp/tpl_extract/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Android SDK and debug keystore for Godot
        run: |
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_pass = "android"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          EOF

      - name: Import resources and run automated tests
        run: |
          godot --headless --import --quit
          godot --headless -s res://tests/run_tests.gd

      - name: Export Windows, Android, and iOS builds
        run: |
          mkdir -p build/windows build/android build/ios release
          godot --headless --export-release "Windows Desktop" build/windows/PlanetSnake3D.exe
          zip -j release/PlanetSnake3D-Windows-x64.zip build/windows/PlanetSnake3D.exe
          godot --headless --export-debug "Android" release/PlanetSnake3D.apk
          godot --headless --export-release "iOS" build/ios/PlanetSnake3D_iOS.ipa
          (cd build/ios && zip -rq ../../release/PlanetSnake3D-iOS-Xcode.zip .)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PlanetSnake3D.apk
            release/PlanetSnake3D-Windows-x64.zip
            release/PlanetSnake3D-iOS-Xcode.zip
          generate_release_notes: true

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlanetSnake3D-builds
          path: release/*
